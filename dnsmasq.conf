# Don't read /etc/resolv.conf, use only servers defined below
no-resolv

# Forward DNS querys to AdGuard Home
server=127.0.0.1#5354
server=::1#5354

# Listen only on br0
interface=br0
except-interface=lo
bind-dynamic

# IPv6 RA + SLAAC + DHCPv6
enable-ra
dhcp-range=set:br0,::100,::1ff,constructor:br0,ra-names,64,24h
ra-param=br0,mtu:CloudflareWARP,300,1800

# IPv4 DHCP range
dhcp-range=set:br0,10.11.11.100,10.11.11.199,255.255.255.0,24h

# DHCP settings
dhcp-lease-max=150
cache-size=0
no-negcache
dhcp-authoritative

# Domain configuration
expand-hosts
domain=warp.lan
local=/warp.lan/
local=/lan/

# Windows compatibility
dhcp-option=252,"\n"
dhcp-option=vendor:MSFT,2,1i

# Security
domain-needed
bogus-priv
localise-queries
stop-dns-rebind
rebind-domain-ok=lan
user=dnsmasq
group=nogroup

# This fixes a security hole. see CERT Vulnerability VU#598349
dhcp-ignore-names=tag:wpad-ignore
dhcp-name-match=set:wpad-ignore,wpad
dhcp-name-match=set:dhcp_bogus_hostname,localhost
dhcp-name-match=set:dhcp_bogus_hostname,wpad

# RFC6761: List of domains that should not be forwarded to Internet name servers
server=/bind/
server=/invalid/
server=/local/
server=/localhost/
server=/onion/
server=/test/
